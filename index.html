<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Criação de um Card de Receita com imagem responsiva, texto organizado e uso correto da tag img e do atributo alt. Exercício para fortalecer fundamentos de layout no front-end.">
    <meta name="author" content="Kamilly Silva De Paula">
    <link rel="stylesheet" href="style.css">
    <title>Card Receita</title>
</head>
<body>
    <div class="recipe">
        <img class="image" src="assets/bolo_de_cenoura.jpg" alt="Bolo de Cenoura e cobertura de chocolate">
    </div>

    <div class="content">
        <h2 class="title">Bolo de Cenoura</h2>
        <p class="description">
            Uma receita clássica e fácil de bolo de cenoura, muito popular no café da manhã e lanche da tarde. Macio, úmido e com cobertura de chocolate, é um doce irresistível preparado no liquidificador, perfeito para acompanhar um cafezinho.
        </p>
    </div>
</body>
</html>
